services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: android
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d android']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.2-management
    mem_limit: ${RABBITMQ_MEMORY_LIMIT:-512m}
    cpus: ${RABBITMQ_CPU_LIMIT:-1.0}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-booker}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12

  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - '127.0.0.1:3000:3000' # Grafana Dashboard (local development)
      - '127.0.0.1:4317:4317' # OTLP gRPC Receiver
      - '127.0.0.1:4318:4318' # OTLP HTTP Receiver

  app:
    build: .
    ports:
      - '${PORT:-8080}:8080'
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-booker}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_SSL_ENABLED: false
      BOOK_REQUEST_EMAIL_ENABLED: ${BOOK_REQUEST_EMAIL_ENABLED:-true}
      BOOK_REQUEST_EMAIL_QUEUE: ${BOOK_REQUEST_EMAIL_QUEUE:-booker.request-emails}
      BOOK_REQUEST_EMAIL_POLL_MILLIS: ${BOOK_REQUEST_EMAIL_POLL_MILLIS:-1000}
      BOOK_REQUEST_EMAIL_BATCH_SIZE: ${BOOK_REQUEST_EMAIL_BATCH_SIZE:-20}
      BOOK_REQUEST_EMAIL_QUEUE_LIMIT: ${BOOK_REQUEST_EMAIL_QUEUE_LIMIT:-1000}
      BOOK_REQUEST_EMAIL_MAX_ATTEMPTS: ${BOOK_REQUEST_EMAIL_MAX_ATTEMPTS:-5}
      BOOK_REQUEST_EMAIL_RETRY_SECONDS: ${BOOK_REQUEST_EMAIL_RETRY_SECONDS:-30}
      BOOK_REQUEST_EMAIL_REDISPATCH_SECONDS: ${BOOK_REQUEST_EMAIL_REDISPATCH_SECONDS:-300}
      DATABASE_URL: jdbc:postgresql://postgres:5432/android
      DATABASE_USERNAME: admin
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a base64-encoded random key of at least 32 bytes}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      BOOK_REQUEST_EMAIL_FROM: ${BOOK_REQUEST_EMAIL_FROM:-}
      PASSWORD_RESET_FROM: ${PASSWORD_RESET_FROM:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-}
      PASSWORD_RESET_TOKEN_PAGE_URL: ${PASSWORD_RESET_TOKEN_PAGE_URL:-}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-PT30M}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P7D}
      GOOGLE_DRIVE_ENABLED: ${GOOGLE_DRIVE_ENABLED:-false}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REDIRECT_URI: ${GOOGLE_DRIVE_REDIRECT_URI:-}
      GOOGLE_DRIVE_ENCRYPTION_KEY: ${GOOGLE_DRIVE_ENCRYPTION_KEY:-}
      GOOGLE_DRIVE_PICKER_API_KEY: ${GOOGLE_DRIVE_PICKER_API_KEY:-}
      GOOGLE_DRIVE_PROJECT_NUMBER: ${GOOGLE_DRIVE_PROJECT_NUMBER:-}
      BOOK_MAX_PAGES: ${BOOK_MAX_PAGES:-20000}
      BOOK_STORAGE_DIRECTORY: /app/data/books
      BOOK_MAX_FILE_SIZE: ${BOOK_MAX_FILE_SIZE:-200MB}
      BOOK_MAX_REQUEST_SIZE: ${BOOK_MAX_REQUEST_SIZE:-201MB}
      BOOK_WORKSPACE_STORAGE_LIMIT: ${BOOK_WORKSPACE_STORAGE_LIMIT:-5GB}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      SSE_MAX_CONNECTIONS: ${SSE_MAX_CONNECTIONS:-200}
      SSE_POLL_MILLIS: ${SSE_POLL_MILLIS:-1000}
      MANAGEMENT_OTLP_METRICS_EXPORT_URL:
    volumes:
      - book-files:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_started
volumes:
  postgres-data:
  book-files:
  rabbitmq-data:
