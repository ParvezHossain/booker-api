services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: android
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d android']
      interval: 5s
      timeout: 5s
      retries: 10

  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - '3000:3000' # Grafana Dashboard
      - '4317:4317' # OTLP gRPC Receiver
      - '4318:4318' # OTLP HTTP Receiver

  app:
    build: .
    ports:
      - '8080:8080'
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/android
      DATABASE_USERNAME: admin
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      MANAGEMENT_OTLP_METRICS_EXPORT_URL:
    depends_on:
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_started
volumes:
  postgres-data:
