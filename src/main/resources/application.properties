spring.application.name=android

# =====================================================
# Server
# =====================================================
server.address=0.0.0.0
server.port=8080

# =====================================================
# Spring Security
# =====================================================
spring.security.user.name=admin
spring.security.user.password=admin

# =====================================================
# Database - PostgreSQL
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/android
spring.datasource.username=admin
spring.datasource.password=admin

# Connection pool / datasource
logging.level.com.zaxxer.hikari=INFO
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.level.com.zaxxer.hikari.pool.HikariPool=DEBUG

# PostgreSQL JDBC driver
logging.level.org.postgresql=INFO


# =====================================================
# JPA / Hibernate
# =====================================================

# Hibernate general
logging.level.org.hibernate=INFO

# Hibernate SQL parameter binding
# Hibernate 6/7:
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Hibernate extracted JDBC values
logging.level.org.hibernate.orm.jdbc.extract=TRACE

# Hibernate transactions
logging.level.org.hibernate.resource.transaction=DEBUG
logging.level.org.hibernate.engine.transaction=DEBUG

# Hibernate entity loading / persistence
logging.level.org.hibernate.loader=DEBUG
logging.level.org.hibernate.persister=DEBUG

# Hibernate schema / metadata
logging.level.org.hibernate.orm.boot=INFO
logging.level.org.hibernate.orm.model=INFO

# Hibernate type system
logging.level.org.hibernate.type=INFO


# =====================================================
# Spring Data JPA
# =====================================================
logging.level.org.springframework.data.jpa=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG


# =====================================================
# SQL Query Logging
# =====================================================

# SQL statements
logging.level.org.hibernate.SQL=DEBUG


# Spring JDBC
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG


# =====================================================
# Transactions
# =====================================================
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.transaction.interceptor=TRACE


# =====================================================
# Flyway
# =====================================================

spring.flyway.validate-on-migrate=true

# Flyway general
logging.level.org.flywaydb=INFO

# Flyway core
logging.level.org.flywaydb.core=DEBUG

# Flyway database migration
logging.level.org.flywaydb.core.internal.command.DbMigrate=DEBUG
logging.level.org.flywaydb.core.internal.sqlscript=DEBUG
logging.level.org.flywaydb.core.internal.sqlscript.DefaultSqlScriptExecutor=DEBUG

# Spring Boot Flyway integration
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG


# =====================================================
# Spring Security
# =====================================================

# Spring Security
logging.level.org.springframework.security=DEBUG

# Authentication
logging.level.org.springframework.security.authentication=DEBUG
logging.level.org.springframework.security.authentication.ProviderManager=DEBUG

# Authorization
logging.level.org.springframework.security.authorization=DEBUG

# Web security
logging.level.org.springframework.security.web=DEBUG

# Security filters
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

# Security configuration
logging.level.org.springframework.security.config=DEBUG

# UserDetails / password authentication
logging.level.org.springframework.security.core=DEBUG


# =====================================================
# Spring MVC / Web
# =====================================================

# Spring MVC
logging.level.org.springframework.web=DEBUG

# DispatcherServlet
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

# Request mapping
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# HTTP request handling
logging.level.org.springframework.web.servlet.mvc.method.annotation=DEBUG

# Exception handling
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=DEBUG


# =====================================================
# Embedded Web Server
# =====================================================

logging.level.org.springframework.boot.web.embedded=INFO

# Tomcat
logging.level.org.apache.catalina=INFO
logging.level.org.apache.coyote=INFO
logging.level.org.apache.tomcat=INFO


# =====================================================
# Spring Boot
# =====================================================

logging.level.org.springframework.boot=INFO

# Auto configuration
logging.level.org.springframework.boot.autoconfigure=INFO

# Auto configuration condition evaluation
logging.level.org.springframework.boot.autoconfigure.condition=DEBUG


# =====================================================
# Validation
# =====================================================

logging.level.org.springframework.validation=DEBUG
logging.level.org.springframework.web.bind=DEBUG

# Hibernate Validator
logging.level.org.hibernate.validator=DEBUG
logging.level.jakarta.validation=DEBUG


# =====================================================
# JobRunr
# =====================================================

logging.level.org.jobrunr=DEBUG
logging.level.org.jobrunr.jobs=DEBUG
logging.level.org.jobrunr.server=DEBUG
logging.level.org.jobrunr.storage=DEBUG


# =====================================================
# OpenTelemetry
# =====================================================

logging.level.io.opentelemetry=INFO
logging.level.io.opentelemetry.sdk=DEBUG
logging.level.io.opentelemetry.exporter=DEBUG

# Spring Boot OpenTelemetry
logging.level.org.springframework.boot.actuate.opentelemetry=DEBUG


# =====================================================
# Spring Actuator
# =====================================================

logging.level.org.springframework.boot.actuate=DEBUG
logging.level.org.springframework.boot.actuate.endpoint=DEBUG
logging.level.org.springframework.boot.actuate.autoconfigure=DEBUG


# =====================================================
# Springdoc / OpenAPI / Swagger
# =====================================================

logging.level.org.springdoc=DEBUG


# =====================================================
# Docker Compose
# =====================================================

logging.level.org.springframework.boot.docker.compose=DEBUG


# =====================================================
# Spring DevTools
# =====================================================

logging.level.org.springframework.boot.devtools=DEBUG


# =====================================================
# Lombok
# =====================================================
# Lombok generally does not produce application runtime logs.


# =====================================================
# Application Logs
# =====================================================

# Your own application
logging.level.com.parvez.android=DEBUG


# =====================================================
# Root Logger
# =====================================================

logging.level.root=INFO


# =====================================================
# Log Format
# =====================================================

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n


# =====================================================
# File Logging
# =====================================================

logging.file.name=logs/android.log

logging.file.max-size=10MB
logging.file.total-size-cap=500MB
logging.file.max-history=30
logging.file.clean-history-on-start=false
