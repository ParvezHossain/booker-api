spring.application.name=booker-saas
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/android}
spring.datasource.username=${DATABASE_USERNAME:admin}
spring.datasource.password=${DATABASE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.validate-on-migrate=true
spring.docker.compose.enabled=false
# Keep Boot's application task executor when dedicated scheduler beans are present.
spring.task.execution.mode=force
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
books.notifications.max-connections=${SSE_MAX_CONNECTIONS:200}
books.notifications.poll-millis=${SSE_POLL_MILLIS:1000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
management.otlp.metrics.export.url=${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl=${JWT_ACCESS_TTL:PT15M}
app.jwt.refresh-ttl=${JWT_REFRESH_TTL:P7D}

books.storage.directory=${BOOK_STORAGE_DIRECTORY:./data/books}
books.documents.max-size=${BOOK_MAX_FILE_SIZE:200MB}
books.documents.max-pages=${BOOK_MAX_PAGES:20000}
books.documents.workspace-limit=${BOOK_WORKSPACE_STORAGE_LIMIT:5GB}
spring.servlet.multipart.max-file-size=${BOOK_MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${BOOK_MAX_REQUEST_SIZE:201MB}
spring.servlet.multipart.file-size-threshold=0

books.google-drive.enabled=${GOOGLE_DRIVE_ENABLED:false}
books.google-drive.client-id=${GOOGLE_DRIVE_CLIENT_ID:}
books.google-drive.client-secret=${GOOGLE_DRIVE_CLIENT_SECRET:}
books.google-drive.redirect-uri=${GOOGLE_DRIVE_REDIRECT_URI:}
books.google-drive.encryption-key=${GOOGLE_DRIVE_ENCRYPTION_KEY:}
books.google-drive.picker-api-key=${GOOGLE_DRIVE_PICKER_API_KEY:}
books.google-drive.project-number=${GOOGLE_DRIVE_PROJECT_NUMBER:}

# Initial setup only; existing Super Admin passwords are never reset at startup.
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}

# SMTP must be configured to enable forgot-password delivery.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.password-reset.from=${PASSWORD_RESET_FROM:}
app.password-reset.url=${PASSWORD_RESET_URL:}
app.password-reset.token-page-url=${PASSWORD_RESET_TOKEN_PAGE_URL:}
app.password-reset.time-zone=${PASSWORD_RESET_TIME_ZONE:Asia/Dhaka}
app.password-reset.ttl=${PASSWORD_RESET_TTL:PT30M}
app.password-reset.monthly-limit=${PASSWORD_RESET_MONTHLY_LIMIT:3}
app.password-reset.email.encryption-key=${PASSWORD_RESET_EMAIL_ENCRYPTION_KEY:}
app.password-reset.email.enabled=${PASSWORD_RESET_EMAIL_ENABLED:true}
app.password-reset.email.queue=${PASSWORD_RESET_EMAIL_QUEUE:booker.password-reset-emails}
app.password-reset.email.poll-millis=${PASSWORD_RESET_EMAIL_POLL_MILLIS:1000}
app.password-reset.email.batch-size=${PASSWORD_RESET_EMAIL_BATCH_SIZE:20}
app.password-reset.email.queue-limit=${PASSWORD_RESET_EMAIL_QUEUE_LIMIT:1000}
app.password-reset.email.max-attempts=${PASSWORD_RESET_EMAIL_MAX_ATTEMPTS:5}
app.password-reset.email.retry-seconds=${PASSWORD_RESET_EMAIL_RETRY_SECONDS:30}
app.password-reset.email.redispatch-seconds=${PASSWORD_RESET_EMAIL_REDISPATCH_SECONDS:300}
app.password-reset.email.lease-seconds=${PASSWORD_RESET_EMAIL_LEASE_SECONDS:60}

# Durable, bounded request/decision email delivery (password-reset mail is separate).
books.requests.email.from=${BOOK_REQUEST_EMAIL_FROM:}
books.requests.email.enabled=${BOOK_REQUEST_EMAIL_ENABLED:true}
books.requests.email.queue=${BOOK_REQUEST_EMAIL_QUEUE:booker.request-emails}
books.requests.email-poll-millis=${BOOK_REQUEST_EMAIL_POLL_MILLIS:1000}
books.requests.email.batch-size=${BOOK_REQUEST_EMAIL_BATCH_SIZE:20}
books.requests.email.queue-limit=${BOOK_REQUEST_EMAIL_QUEUE_LIMIT:1000}
books.requests.email.max-attempts=${BOOK_REQUEST_EMAIL_MAX_ATTEMPTS:5}
books.requests.email.retry-seconds=${BOOK_REQUEST_EMAIL_RETRY_SECONDS:30}
books.requests.email.redispatch-seconds=${BOOK_REQUEST_EMAIL_REDISPATCH_SECONDS:300}
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:booker}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:booker}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
management.health.rabbit.enabled=${RABBITMQ_HEALTH_ENABLED:true}

# Password replacement confirmations; pause delivery without losing audit/outbox acceptance.
app.password-change.email.from=${PASSWORD_CHANGE_EMAIL_FROM:}
app.password-change.email.enabled=${PASSWORD_CHANGE_EMAIL_ENABLED:true}
app.password-change.email.queue=${PASSWORD_CHANGE_EMAIL_QUEUE:booker.password-change-emails}
app.password-change.email.poll-millis=${PASSWORD_CHANGE_EMAIL_POLL_MILLIS:1000}
app.password-change.email.batch-size=${PASSWORD_CHANGE_EMAIL_BATCH_SIZE:20}
app.password-change.email.queue-limit=${PASSWORD_CHANGE_EMAIL_QUEUE_LIMIT:1000}
app.password-change.email.max-attempts=${PASSWORD_CHANGE_EMAIL_MAX_ATTEMPTS:5}
app.password-change.email.retry-seconds=${PASSWORD_CHANGE_EMAIL_RETRY_SECONDS:30}
app.password-change.email.redispatch-seconds=${PASSWORD_CHANGE_EMAIL_REDISPATCH_SECONDS:300}
app.password-change.email.lease-seconds=${PASSWORD_CHANGE_EMAIL_LEASE_SECONDS:60}
