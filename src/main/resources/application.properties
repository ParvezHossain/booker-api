spring.application.name=booker-saas
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/android}
spring.datasource.username=${DATABASE_USERNAME:admin}
spring.datasource.password=${DATABASE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.validate-on-migrate=true
spring.docker.compose.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
books.notifications.max-connections=${SSE_MAX_CONNECTIONS:200}
books.notifications.poll-millis=${SSE_POLL_MILLIS:1000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
management.otlp.metrics.export.url=${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl=${JWT_ACCESS_TTL:PT15M}
app.jwt.refresh-ttl=${JWT_REFRESH_TTL:P7D}

books.storage.directory=${BOOK_STORAGE_DIRECTORY:./data/books}
books.documents.max-size=${BOOK_MAX_FILE_SIZE:200MB}
books.documents.max-pages=${BOOK_MAX_PAGES:20000}
books.documents.workspace-limit=${BOOK_WORKSPACE_STORAGE_LIMIT:5GB}
spring.servlet.multipart.max-file-size=${BOOK_MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${BOOK_MAX_REQUEST_SIZE:201MB}
spring.servlet.multipart.file-size-threshold=0

books.google-drive.enabled=${GOOGLE_DRIVE_ENABLED:false}
books.google-drive.client-id=${GOOGLE_DRIVE_CLIENT_ID:}
books.google-drive.client-secret=${GOOGLE_DRIVE_CLIENT_SECRET:}
books.google-drive.redirect-uri=${GOOGLE_DRIVE_REDIRECT_URI:}
books.google-drive.encryption-key=${GOOGLE_DRIVE_ENCRYPTION_KEY:}
books.google-drive.picker-api-key=${GOOGLE_DRIVE_PICKER_API_KEY:}
books.google-drive.project-number=${GOOGLE_DRIVE_PROJECT_NUMBER:}
